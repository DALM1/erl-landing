<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Page non listee : exclue des moteurs de recherche et jamais liee depuis le site public. -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <meta name="referrer" content="no-referrer">
    <title>ERL</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        @font-face {
            font-family: 'Orbitron';
            src: url('Orbitron-Bold.ttf') format('truetype');
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #07080e;
            min-height: 100vh;
            min-height: 100dvh;
            color: #e8e8ef;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            -webkit-text-size-adjust: 100%;
            -webkit-tap-highlight-color: transparent;
        }

        .void {
            text-align: center;
            color: rgba(255, 255, 255, 0.18);
            font-size: 0.9rem;
            letter-spacing: 0.08em;
        }

        .card {
            width: 100%;
            max-width: 460px;
            background: rgba(18, 20, 30, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 2rem 1.75rem;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
        }

        .card.wide { max-width: 560px; }

        h1 {
            font-family: 'Orbitron', -apple-system, sans-serif;
            font-size: 1.15rem;
            letter-spacing: 0.14em;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 0.35rem;
        }

        .sub {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.42);
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: rgba(255, 255, 255, 0.45);
            margin-bottom: 0.4rem;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 0.75rem 0.9rem;
            margin-bottom: 1rem;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s ease;
        }

        input:focus { border-color: rgba(120, 160, 255, 0.6); }

        button {
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 0.75rem 1.1rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: filter 0.15s ease, opacity 0.15s ease;
        }

        button:disabled { opacity: 0.45; cursor: default; }

        button:hover:not(:disabled) { filter: brightness(1.12); }

        .primary { width: 100%; background: #4b6bfb; color: #fff; }

        .ghost {
            background: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.85);
        }

        .row { display: flex; gap: 0.6rem; align-items: stretch; }
        .row > input { margin-bottom: 0; }
        .row > button { flex-shrink: 0; }

        .actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1rem; }
        .actions > button { flex: 1 1 auto; }

        .userbox {
            margin-top: 1.25rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.25);
        }

        .userbox dl { display: grid; grid-template-columns: auto 1fr; gap: 0.3rem 1rem; font-size: 0.85rem; }
        .userbox dt { color: rgba(255, 255, 255, 0.42); }
        .userbox dd { color: #fff; word-break: break-word; }

        .badge {
            display: inline-block;
            font-size: 0.7rem;
            padding: 0.15rem 0.5rem;
            border-radius: 999px;
            letter-spacing: 0.06em;
        }
        .badge.clean { background: rgba(63, 157, 90, 0.18); color: #7fd79a; }
        .badge.banned { background: rgba(217, 72, 63, 0.18); color: #f0928c; }

        .head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.25rem;
        }

        .head .who { font-size: 0.8rem; color: rgba(255, 255, 255, 0.5); }
        .head .who b { color: #fff; }

        .log {
            margin-top: 1.25rem;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 0.78rem;
            line-height: 1.5;
            color: rgba(255, 255, 255, 0.6);
            max-height: 180px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .log .err { color: #f0928c; }
        .log .ok { color: #7fd79a; }

        .msg { min-height: 1.1em; font-size: 0.82rem; margin-top: 0.5rem; color: rgba(255, 255, 255, 0.5); }
        .msg.err { color: #f0928c; }

        .hidden { display: none !important; }

        @font-face {
            font-family: 'Rajdhani';
            src: url('Rajdhani-Variable.ttf') format('truetype');
            font-weight: 300 700;
            font-style: normal;
            font-display: swap;
        }

        :root {
            color-scheme: dark;
            --surface: rgba(16, 18, 23, 0.84);
            --surface-border: rgba(255, 255, 255, 0.12);
            --input-bg: rgba(255, 255, 255, 0.05);
            --accent: #4b6bfb;
            --text: #f7f1f1;
            --muted: rgba(255, 255, 255, 0.62);
        }

        body {
            position: relative;
            overflow-x: hidden;
            font-family: 'Rajdhani', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background:
                radial-gradient(ellipse at 18% 12%, rgba(75, 107, 251, 0.13), transparent 38rem),
                radial-gradient(ellipse at 84% 88%, rgba(91, 70, 180, 0.11), transparent 34rem),
                #060608;
            color: var(--text);
            padding: clamp(1rem, 3vw, 2.5rem);
        }

        #app {
            width: min(1120px, 100%);
            margin: auto;
        }

        .void {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1rem;
            letter-spacing: 0.1em;
        }

        .card,
        .glass-panel {
            background: var(--surface);
            border: 1px solid var(--surface-border);
            border-radius: 28px;
            box-shadow:
                0 28px 80px rgba(0, 0, 0, 0.46),
                inset 0 1px 0 rgba(255, 255, 255, 0.035);
            -webkit-backdrop-filter: blur(28px) saturate(135%);
            backdrop-filter: blur(28px) saturate(135%);
        }

        .card {
            width: min(100%, 430px);
            max-width: 430px;
            padding: clamp(1.5rem, 5vw, 2.6rem);
            margin: auto;
        }

        .card.wide { max-width: none; }

        h1 {
            font-size: 1.8rem;
            letter-spacing: 0.12em;
            text-align: center;
            margin-bottom: 0.35rem;
        }

        .sub {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.05rem;
            text-align: center;
            margin-bottom: 1.65rem;
        }

        label {
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.1em;
        }

        input[type="text"],
        input[type="password"] {
            min-height: 50px;
            padding: 0.8rem 1rem;
            margin-bottom: 1rem;
            background: var(--input-bg);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.05rem;
        }

        input:focus {
            border-color: rgba(75, 107, 251, 0.72);
            box-shadow: 0 0 0 3px rgba(75, 107, 251, 0.13);
        }

        button {
            min-height: 44px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            border: 1px solid transparent;
            border-radius: 14px;
            transition: transform 0.16s ease, background 0.16s ease, border-color 0.16s ease;
        }

        button:hover:not(:disabled) {
            filter: none;
            transform: translateY(-1px);
        }

        button:focus-visible {
            outline: 2px solid rgba(126, 151, 255, 0.9);
            outline-offset: 3px;
        }

        .primary {
            min-height: 52px;
            background: var(--accent);
            border-color: rgba(142, 160, 255, 0.25);
            border-radius: 16px;
            box-shadow: 0 10px 28px rgba(75, 107, 251, 0.24);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 0.04em;
        }

        .ghost,
        .action-neutral,
        .refresh-button {
            color: rgba(255, 255, 255, 0.88);
            background: rgba(255, 255, 255, 0.055);
            border-color: rgba(255, 255, 255, 0.11);
            -webkit-backdrop-filter: blur(14px);
            backdrop-filter: blur(14px);
        }

        .ghost:hover:not(:disabled),
        .action-neutral:hover:not(:disabled),
        .refresh-button:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.19);
        }

        .danger {
            color: #ffe3e3;
            background: rgba(210, 55, 65, 0.2);
            border-color: rgba(255, 129, 137, 0.25);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
            -webkit-backdrop-filter: blur(14px);
            backdrop-filter: blur(14px);
        }

        .danger:hover:not(:disabled) {
            background: rgba(210, 55, 65, 0.32);
            border-color: rgba(255, 129, 137, 0.4);
        }

        .row { gap: 0.75rem; }
        .row > button { min-width: 118px; }

        .actions {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 0.65rem;
        }

        .actions > button { min-width: 0; }

        .userbox {
            background: rgba(0, 0, 0, 0.2);
            border-color: rgba(255, 255, 255, 0.075);
            border-radius: 18px;
        }

        .userbox dl {
            grid-template-columns: 80px minmax(0, 1fr);
            gap: 0.45rem 0.75rem;
            font-size: 1rem;
        }

        .head .who { font-family: 'Rajdhani', sans-serif; font-size: 1rem; }

        .admin-workspace { width: 100%; }

        .workspace-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 1rem;
            padding: 0.25rem 0.15rem;
        }

        .workspace-brand {
            display: flex;
            align-items: center;
            gap: 0.9rem;
        }

        .workspace-brand h1 {
            margin: 0;
            font-size: 1rem;
            text-align: left;
        }

        .workspace-brand span,
        .workspace-session {
            color: var(--muted);
            font-size: 0.95rem;
        }

        .workspace-session b { color: var(--text); }

        .workspace-session {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .admin-grid {
            display: grid;
            grid-template-columns: minmax(0, 1.1fr) minmax(320px, 0.9fr);
            align-items: start;
            gap: 1rem;
        }

        .glass-panel { padding: clamp(1.15rem, 3vw, 1.7rem); }

        .panel-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            letter-spacing: 0.08em;
            margin-bottom: 0.4rem;
        }

        .panel-subtitle {
            color: var(--muted);
            font-size: 0.95rem;
            margin-bottom: 1.2rem;
        }

        .reports-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 0.75rem;
        }

        .refresh-button {
            min-height: 38px;
            padding: 0.45rem 0.75rem;
            white-space: nowrap;
        }

        .reports-status {
            min-height: 1.25rem;
            margin-bottom: 0.65rem;
            color: var(--muted);
            font-size: 0.9rem;
        }

        .reports-list {
            display: grid;
            gap: 0.65rem;
            max-height: min(570px, 65vh);
            overflow-y: auto;
            padding-right: 0.2rem;
        }

        .report-card {
            padding: 0.9rem;
            border: 1px solid rgba(255, 255, 255, 0.075);
            border-radius: 16px;
            background: rgba(0, 0, 0, 0.19);
        }

        .report-top,
        .report-target-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
        }

        .report-type {
            color: #c7d1ff;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.62rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .report-date,
        .report-detail {
            color: var(--muted);
            font-size: 0.85rem;
        }

        .report-target {
            margin: 0.55rem 0 0.2rem;
            font-size: 1.05rem;
            font-weight: 700;
            overflow-wrap: anywhere;
        }

        .report-reason { color: #f2f2f7; font-size: 0.95rem; }

        .report-action {
            min-height: 34px;
            padding: 0.3rem 0.65rem;
            font-size: 0.85rem;
            white-space: nowrap;
        }

        .log {
            max-height: 150px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.9rem;
        }

        .msg,
        .log .ok { color: #aebaff; }

        @media (max-width: 760px) {
            body { align-items: flex-start; padding: 1rem; }
            .admin-grid { grid-template-columns: minmax(0, 1fr); }
            .workspace-head { align-items: flex-start; }
            .workspace-brand span { display: none; }
            .reports-list { max-height: 55vh; }
        }

        @media (max-width: 440px) {
            .row { flex-direction: column; }
            .row > button { width: 100%; }
            .actions { grid-template-columns: minmax(0, 1fr); }
            .workspace-session { gap: 0.45rem; font-size: 0.85rem; }
            .userbox dl { grid-template-columns: 64px minmax(0, 1fr); }
            .report-top { align-items: flex-start; flex-direction: column; gap: 0.15rem; }
        }
    </style>
</head>
<body>
    <div id="void" class="void">Page introuvable</div>

    <main id="app" class="hidden">
        <!-- Ecran de connexion -->
        <section id="login" class="card">
            <h1>ERL</h1>
            <p class="sub">Accès réservé</p>
            <form id="login-form" autocomplete="off">
                <label for="u">Identifiant</label>
                <input type="text" id="u" autocapitalize="off" autocorrect="off" spellcheck="false">
                <label for="p">Mot de passe</label>
                <input type="password" id="p">
                <button type="submit" class="primary">Entrer</button>
            </form>
            <div id="login-msg" class="msg"></div>
        </section>

        <!-- Console d'administration, visible uniquement après validation serveur du compte admin. -->
        <div id="console" class="admin-workspace hidden">
            <header class="workspace-head">
                <div class="workspace-brand">
                    <h1>ERL</h1>
                    <span>CONSOLE PRIVÉE</span>
                </div>
                <div class="workspace-session">
                    <span>Connecté : <b id="who"></b></span>
                    <button id="logout" class="ghost" type="button">Quitter</button>
                </div>
            </header>

            <div class="admin-grid">
                <section class="glass-panel manage-panel" aria-labelledby="manage-title">
                    <h2 id="manage-title" class="panel-title">Gestion des comptes</h2>
                    <p class="panel-subtitle">Recherche et actions de modération rapides.</p>

                    <label for="q">Compte à cibler</label>
                    <div class="row">
                        <input type="text" id="q" placeholder="Nom d'utilisateur" autocapitalize="off" autocorrect="off" spellcheck="false">
                        <button id="search" class="ghost" type="button">Rechercher</button>
                    </div>

                    <div id="userbox" class="userbox hidden">
                        <dl>
                            <dt>Nom</dt><dd id="f-username"></dd>
                            <dt>Afficher</dt><dd id="f-display"></dd>
                            <dt>ID</dt><dd id="f-id"></dd>
                            <dt>État</dt><dd id="f-state"></dd>
                            <dt>Motif</dt><dd id="f-reason"></dd>
                        </dl>

                        <label for="reason" style="margin-top:1rem">Motif (optionnel)</label>
                        <input type="text" id="reason" maxlength="280" placeholder="Raison de la sanction">

                        <div class="actions">
                            <button id="ban" class="action-neutral" type="button">Bannir</button>
                            <button id="unban" class="action-neutral" type="button">Débannir</button>
                            <button id="del" class="danger" type="button">Supprimer</button>
                        </div>
                    </div>

                    <div id="log" class="log" aria-live="polite"></div>
                </section>

                <aside class="glass-panel reports-panel" aria-labelledby="reports-title">
                    <div class="reports-head">
                        <div>
                            <h2 id="reports-title" class="panel-title">Signalements récents</h2>
                            <p class="panel-subtitle">Publications, commentaires et messages.</p>
                        </div>
                        <button id="reports-refresh" class="refresh-button" type="button">Actualiser</button>
                    </div>
                    <div id="reports-status" class="reports-status" role="status">Chargement des signalements…</div>
                    <div id="reports-list" class="reports-list" aria-live="polite"></div>
                </aside>
            </div>
        </div>
    </main>

    <script>
        "use strict";

        // API publique (edge mustelinet). Le controle d'acces reel est fait cote serveur :
        // seuls les comptes de ERL_ADMIN_USERNAMES peuvent appeler /admin/*.
        var API = "https://2xpw4vcfwanye.46bd6e51.apps.mustelinet.com";
        var GATE = "#ops"; // fragment requis pour afficher la page

        var $ = function (id) { return document.getElementById(id); };
        var TOKEN = "";
        var CURRENT = null;

        try { TOKEN = sessionStorage.getItem("erl_ops_tok") || ""; } catch (e) { TOKEN = ""; }

        function show(el, on) { el.classList.toggle("hidden", !on); }

        function log(text, kind) {
            var box = $("log");
            var line = document.createElement("div");
            if (kind) { line.className = kind; }
            line.textContent = "· " + text;
            box.appendChild(line);
            box.scrollTop = box.scrollHeight;
        }

        function reportKindLabel(kind) {
            return {
                post: "Publication",
                comment: "Commentaire",
                message: "Message"
            }[kind] || "Signalement";
        }

        function reportReasonLabel(reason) {
            return {
                spam: "Spam",
                inappropriate: "Contenu inapproprié"
            }[reason] || reason || "Motif non précisé";
        }

        function renderReports(reports) {
            var list = $("reports-list");
            list.textContent = "";

            if (!reports.length) {
                $("reports-status").textContent = "Aucun signalement récent.";
                return;
            }

            $("reports-status").textContent =
                reports.length + " signalement" + (reports.length > 1 ? "s" : "") +
                " récent" + (reports.length > 1 ? "s" : "");

            reports.forEach(function (report) {
                var card = document.createElement("article");
                card.className = "report-card";

                var top = document.createElement("div");
                top.className = "report-top";
                var type = document.createElement("span");
                type.className = "report-type";
                type.textContent = reportKindLabel(report.kind);
                var date = document.createElement("time");
                date.className = "report-date";
                date.dateTime = report.inserted_at || "";
                var parsedDate = new Date(report.inserted_at);
                date.textContent = Number.isNaN(parsedDate.getTime())
                    ? "Date inconnue"
                    : parsedDate.toLocaleString("fr-FR", { dateStyle: "short", timeStyle: "short" });
                top.appendChild(type);
                top.appendChild(date);

                var targetRow = document.createElement("div");
                targetRow.className = "report-target-row";
                var target = document.createElement("p");
                target.className = "report-target";
                target.textContent = report.reported_username
                    ? "@" + report.reported_username
                    : "Compte indisponible";
                targetRow.appendChild(target);

                if (report.reported_username) {
                    var targetButton = document.createElement("button");
                    targetButton.type = "button";
                    targetButton.className = "ghost report-action";
                    targetButton.textContent = "Cibler";
                    targetButton.addEventListener("click", function () {
                        $("q").value = report.reported_username;
                        search();
                    });
                    targetRow.appendChild(targetButton);
                }

                var detail = document.createElement("p");
                detail.className = "report-detail";
                detail.textContent = "Signalé par @" + (report.reporter_username || "compte supprimé");

                var reason = document.createElement("p");
                reason.className = "report-reason";
                reason.textContent = reportReasonLabel(report.reason);

                var reference = document.createElement("p");
                reference.className = "report-detail";
                reference.textContent = "Réf. " + String(report.subject_id || "—");

                card.appendChild(top);
                card.appendChild(targetRow);
                card.appendChild(detail);
                card.appendChild(reason);
                card.appendChild(reference);
                list.appendChild(card);
            });
        }

        function loadReports() {
            var refresh = $("reports-refresh");
            refresh.disabled = true;
            $("reports-status").textContent = "Chargement des signalements…";

            api("/admin/reports?limit=20").then(function (result) {
                renderReports(Array.isArray(result.reports) ? result.reports : []);
            }).catch(function (e) {
                $("reports-status").textContent = "Chargement impossible : " + humanize(e);
            }).finally(function () {
                refresh.disabled = false;
            });
        }

        function stamp() {
            var d = new Date();
            return d.toLocaleTimeString();
        }

        function setToken(t) {
            TOKEN = t || "";
            try {
                if (TOKEN) { sessionStorage.setItem("erl_ops_tok", TOKEN); }
                else { sessionStorage.removeItem("erl_ops_tok"); }
            } catch (e) { /* stockage indisponible : on garde le token en memoire */ }
        }

        // Appel API JSON. Leve un objet { message } en cas d'echec.
        function api(path, opts) {
            opts = opts || {};
            var headers = { "content-type": "application/json" };
            if (opts.auth !== false && TOKEN) { headers["authorization"] = "Bearer " + TOKEN; }

            return fetch(API + path, {
                method: opts.method || "GET",
                headers: headers,
                body: opts.body ? JSON.stringify(opts.body) : undefined
            }).then(function (res) {
                return res.text().then(function (txt) {
                    var data = null;
                    if (txt) { try { data = JSON.parse(txt); } catch (e) { data = null; } }
                    if (!res.ok) {
                        var err = new Error(((data && data.error) || ("HTTP " + res.status)));
                        err.code = (data && data.error) || String(res.status);
                        err.status = res.status;
                        throw err;
                    }
                    return data || {};
                });
            }).catch(function (e) {
                if (e && e.status) { throw e; }
                var n = new Error("réseau injoignable");
                n.code = "network";
                throw n;
            });
        }

        var MESSAGES = {
            invalid: "identifiants invalides",
            unauthorized: "identifiants invalides",
            account_banned: "ce compte est suspendu",
            forbidden: "accès refusé",
            user_not_found: "compte introuvable",
            username_required: "nom manquant",
            cannot_target_self: "impossible de viser son propre compte",
            confirmation_required: "confirmation incorrecte",
            network: "réseau injoignable"
        };

        function humanize(e) {
            return MESSAGES[e.code] || e.message || "erreur";
        }

        // --- Connexion -------------------------------------------------------

        function doLogin(ev) {
            ev.preventDefault();
            var msg = $("login-msg");
            msg.className = "msg";
            msg.textContent = "Connexion…";

            api("/auth/login", {
                method: "POST",
                auth: false,
                body: { username: $("u").value.trim(), password: $("p").value }
            }).then(function (r) {
                if (!r || !r.token) { throw new Error("réponse invalide"); }
                setToken(r.token);
                return verify();
            }).catch(function (e) {
                setToken("");
                msg.className = "msg err";
                msg.textContent = humanize(e);
            });
        }

        function verify() {
            return api("/admin/me").then(function (me) {
                $("who").textContent = me.username;
                show($("login"), false);
                show($("console"), true);
                log(stamp() + "  session ouverte");
                $("p").value = "";
                loadReports();
            }).catch(function (e) {
                setToken("");
                var msg = $("login-msg");
                msg.className = "msg err";
                msg.textContent = humanize(e);
            });
        }

        function logout() {
            setToken("");
            CURRENT = null;
            show($("console"), false);
            show($("login"), true);
            show($("userbox"), false);
            $("log").textContent = "";
            $("login-msg").textContent = "";
            $("u").value = "";
            $("p").value = "";
            $("q").value = "";
        }

        // --- Console ---------------------------------------------------------

        function renderUser(u) {
            CURRENT = u;
            $("f-username").textContent = u.username || "";
            $("f-display").textContent = u.display_name || "—";
            $("f-id").textContent = u.id != null ? u.id : "—";
            $("f-state").innerHTML = u.banned
                ? '<span class="badge banned">SUSPENDU</span>'
                : '<span class="badge clean">ACTIF</span>';
            $("f-reason").textContent = u.ban_reason || "—";
            $("reason").value = u.ban_reason || "";
            show($("userbox"), true);
        }

        function search() {
            var username = $("q").value.trim();
            if (!username) { return; }
            api("/admin/lookup", { method: "POST", body: { username: username } })
                .then(function (r) { renderUser(r.user); })
                .catch(function (e) { show($("userbox"), false); log("recherche : " + humanize(e), "err"); });
        }

        function act(path, body, label) {
            if (!CURRENT) { return; }
            body = body || {};
            body.username = CURRENT.username;
            api(path, { method: "POST", body: body }).then(function (r) {
                if (r && r.user) { renderUser(r.user); }
                log(label + " : OK — " + (r && r.username ? r.username : CURRENT.username), "ok");
            }).catch(function (e) {
                log(label + " : " + humanize(e), "err");
            });
        }

        function ban() {
            act("/admin/ban", { reason: $("reason").value.trim() }, "bannissement");
        }

        function unban() {
            act("/admin/unban", {}, "débannissement");
        }

        function remove() {
            if (!CURRENT) { return; }
            var typed = window.prompt("Suppression définitive. Tapez « " + CURRENT.username + " » pour confirmer :");
            if (typed === null) { return; }
            if (typed.trim().toLowerCase() !== String(CURRENT.username).toLowerCase()) {
                log("suppression : confirmation incorrecte", "err");
                return;
            }
            api("/admin/delete", { method: "POST", body: { username: CURRENT.username, confirm: typed.trim() } })
                .then(function (r) {
                    log("suppression : compte « " + (r && r.username ? r.username : CURRENT.username) + " » supprimé", "ok");
                    CURRENT = null;
                    show($("userbox"), false);
                    $("q").value = "";
                })
                .catch(function (e) { log("suppression : " + humanize(e), "err"); });
        }

        // --- Amorçage --------------------------------------------------------

        function boot() {
            // Sans fragment d'accès, la page reste sur « Page introuvable ».
            if (location.hash !== GATE) { return; }
            show($("void"), false);
            show($("app"), true);
            if (TOKEN) { verify(); }

            $("login-form").addEventListener("submit", doLogin);
            $("logout").addEventListener("click", logout);
            $("search").addEventListener("click", search);
            $("q").addEventListener("keydown", function (e) { if (e.key === "Enter") { search(); } });
            $("ban").addEventListener("click", ban);
            $("unban").addEventListener("click", unban);
            $("del").addEventListener("click", remove);
            $("reports-refresh").addEventListener("click", loadReports);
        }

        boot();
    </script>
</body>
</html>
