<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERL</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: pointer;
        }

        .splash {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2.5rem;
        }

        /* Logo container — holds both halves stacked on top of each other */
        .logo-stage {
            position: relative;
            width: 220px;
            height: 220px;
        }

        .logo-half {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 44px;
        }

        /* ER part: left 60% of the logo */
        .er {
            clip-path: inset(0 40% 0 0);
            opacity: 0;
            transform: scale(0.85);
            animation: erIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            filter: drop-shadow(0 8px 40px rgba(124, 77, 255, 0.4));
        }

        /* L part: right 40% of the logo */
        .l {
            clip-path: inset(0 0 0 60%);
            opacity: 0;
            /* flip around the left edge of the L (which sits at 60% of the image) */
            transform-origin: 60% center;
            transform: rotateY(90deg);
            animation: lFlip 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) 0.45s forwards;
            filter: drop-shadow(0 8px 40px rgba(124, 77, 255, 0.4));
        }

        @keyframes erIn {
            0%   { opacity: 0; transform: scale(0.85); }
            100% { opacity: 1; transform: scale(1); }
        }

        @keyframes lFlip {
            0%   { opacity: 0; transform: rotateY(90deg); }
            60%  { opacity: 1; }
            100% { opacity: 1; transform: rotateY(0deg); }
        }

        .title {
            font-size: 1.6rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.05em;
            opacity: 0;
            animation: fadeUp 0.5s ease 1.1s forwards;
        }

        .subtitle {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.55);
            margin-top: -1.8rem;
            opacity: 0;
            animation: fadeUp 0.5s ease 1.3s forwards;
        }

        @keyframes fadeUp {
            0%   { opacity: 0; transform: translateY(12px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .skip-hint {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 0.05em;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.7; }
        }

        .fade-out {
            animation: bodyFade 0.5s ease forwards;
        }

        @keyframes bodyFade {
            0%   { opacity: 1; }
            100% { opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="splash">
        <div class="logo-stage">
            <img src="favicon.png" alt="ER" class="logo-half er">
            <img src="favicon.png" alt="L" class="logo-half l">
        </div>
        <div class="title">ERL</div>
        <div class="subtitle">Chargement…</div>
    </div>
    <div class="skip-hint">Cliquez pour passer</div>

    <script>
        let redirected = false;

        function goHome() {
            if (redirected) return;
            redirected = true;
            document.body.classList.add('fade-out');
            setTimeout(() => {
                window.location.href = 'home.html';
            }, 480);
        }

        // Auto-redirect after the animation
        setTimeout(goHome, 2400);

        // Skip on click / tap / key
        document.body.addEventListener('click', goHome);
        document.addEventListener('keydown', goHome);
    </script>
</body>
</html>
