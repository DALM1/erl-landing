<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERL</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        @font-face {
            font-family: 'Orbitron';
            src: url('Orbitron-Bold.ttf') format('truetype');
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .splash {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2.5rem;
            padding: 1rem;
        }

        .logo-stage {
            position: relative;
            width: 220px;
            height: 220px;
        }

        .logo-half {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 0;
        }

        .er {
            clip-path: inset(0 40% 0 0);
            opacity: 0;
            transform: scale(0.85);
            animation: erIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        .l {
            clip-path: inset(0 0 0 60%);
            opacity: 0;
            transform-origin: 60% center;
            transform: rotateY(90deg);
            animation: lFlip 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) 0.45s forwards;
        }

        @keyframes erIn {
            0%   { opacity: 0; transform: scale(0.85); }
            100% { opacity: 1; transform: scale(1); }
        }

        @keyframes lFlip {
            0%   { opacity: 0; transform: rotateY(90deg); }
            60%  { opacity: 1; }
            100% { opacity: 1; transform: rotateY(0deg); }
        }

        .title {
            font-family: 'Orbitron', -apple-system, sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.08em;
            opacity: 0;
            animation: fadeUp 0.5s ease 1.1s forwards;
        }

        .subtitle {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.42);
            margin-top: -1.8rem;
            opacity: 0;
            animation: fadeUp 0.5s ease 1.3s forwards;
        }

        @keyframes fadeUp {
            0%   { opacity: 0; transform: translateY(12px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .skip-hint {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 0.05em;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.7; }
        }

        .fade-out {
            animation: bodyFade 0.5s ease forwards;
        }

        @keyframes bodyFade {
            0%   { opacity: 1; }
            100% { opacity: 0; }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .logo-stage { width: 180px; height: 180px; }
            .title { font-size: 1.5rem; }
            .splash { gap: 2rem; }
        }

        @media (max-width: 480px) {
            .logo-stage { width: 150px; height: 150px; }
            .title { font-size: 1.3rem; }
            .subtitle { font-size: 0.85rem; margin-top: -1.5rem; }
            .splash { gap: 1.75rem; }
            .skip-hint { bottom: 1.25rem; font-size: 0.72rem; }
        }

        @media (max-width: 360px) {
            .logo-stage { width: 130px; height: 130px; }
            .title { font-size: 1.15rem; }
        }

        @media (max-height: 500px) and (orientation: landscape) {
            .logo-stage { width: 120px; height: 120px; }
            .splash { gap: 1.25rem; }
            .skip-hint { bottom: 0.75rem; }
        }
    </style>
</head>
<body>
    <div class="splash">
        <div class="logo-stage">
            <img src="favicon.png" alt="ER" class="logo-half er">
            <img src="favicon.png" alt="L" class="logo-half l">
        </div>
        <div class="title">ERL</div>
        <div class="subtitle" data-i18n="loading">Chargement…</div>
    </div>
    <div class="skip-hint" data-i18n="click_to_skip">Cliquez pour passer</div>

    <script>
        // Translations
        const I18N = {
            en: { loading: 'Loading…', click_to_skip: 'Click to skip' },
            zh: { loading: '加载中…', click_to_skip: '点击跳过' },
            fr: { loading: 'Chargement…', click_to_skip: 'Cliquez pour passer' },
            ru: { loading: 'Загрузка…', click_to_skip: 'Нажмите чтобы пропустить' }
        };

        function detectLang() {
            const nav = (navigator.language || 'en').toLowerCase();
            if (nav.startsWith('zh')) return 'zh';
            if (nav.startsWith('fr')) return 'fr';
            if (nav.startsWith('ru')) return 'ru';
            return 'en';
        }

        function applyI18n(lang) {
            const t = I18N[lang] || I18N.en;
            document.documentElement.lang = lang;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) el.textContent = t[key];
            });
        }

        applyI18n(detectLang());

        let redirected = false;

        function goHome() {
            if (redirected) return;
            redirected = true;
            document.body.classList.add('fade-out');
            setTimeout(() => {
                window.location.href = 'home.html';
            }, 480);
        }

        setTimeout(goHome, 2400);

        document.body.addEventListener('click', goHome);
        document.addEventListener('keydown', goHome);
    </script>
</body>
</html>
